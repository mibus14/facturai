{% extends "base.html" %}
{% block title %}Iniciar sesión – FacturAI{% endblock %}
{% block content %}
<div class="form-page" style="max-width:460px;">
  <div style="text-align:center;margin-bottom:2rem;">
    <h1 style="font-size:1.8rem;font-weight:900;letter-spacing:-.5px;">Bienvenido de vuelta</h1>
    <p style="color:var(--gray);margin-top:.3rem;">Inicia sesión en tu cuenta FacturAI</p>
  </div>
  {% if error %}
  <div class="alert alert-danger">⚠️ {{ error }}</div>
  {% endif %}
  <div class="form-card">
    <form method="post" action="/login">
      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" placeholder="juan@empresa.com" required autofocus>
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:.85rem;font-size:1rem;">
        Iniciar sesión
      </button>
    </form>
    <p style="text-align:center;margin-top:1.2rem;color:var(--gray);font-size:.9rem;">
      ¿No tienes cuenta? <a href="/register" style="color:var(--primary);font-weight:600;">Regístrate gratis</a>
    </p>
  </div>
</div>
{% endblock %}
